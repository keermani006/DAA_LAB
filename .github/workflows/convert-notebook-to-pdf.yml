name: Convert notebook to PDF

on:
  workflow_dispatch: {}
  push:
    paths:
      - 'CH_SC_U4CSE24135_EDA.ipynb'

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "nbconvert[webpdf]" pyppeteer
          python -m pyppeteer install || true

      - name: Convert notebook to PDF
        working-directory: ${{ github.workspace }}
        run: |
          jupyter nbconvert --to webpdf CH_SC_U4CSE24135_EDA.ipynb --output CH_SC_U4CSE24135_EDA.pdf

      - name: Commit generated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CH_SC_U4CSE24135_EDA.pdf
          git commit -m "Add CH_SC_U4CSE24135_EDA.pdf (generated by workflow)" || echo "No changes to commit"
          git push
